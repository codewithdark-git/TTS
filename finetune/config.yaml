# CHANGE THIS TO YOUR OWN DATASET
# English fine-tuning example:
#   TTS_dataset: canopylabs/zac-sample-dataset
# Urdu fine-tuning example (Nastaliq/Arabic script):
#   TTS_dataset: <PATH_TO_YOUR_URDU_DATASET>
TTS_dataset: <PATH_TO_YOUR_DATASET>

# Language of the dataset: "en" for English, "ur" for Urdu.
# When fine-tuning for Urdu, set this to "ur" and use an Urdu TTS dataset above.
# Voice names should match the language — e.g. use "zia" for an Urdu speaker voice.
# language: "en"

model_name: "canopylabs/orpheus-tts-0.1-pretrained"

# Training Args
epochs: 1
batch_size: 1
number_processes: 1
pad_token: 128263
save_steps: 5000
learning_rate: 5.0e-5

# Naming and paths
save_folder: "checkpoints"
project_name: "tuning-orpheus"
run_name: "5e5-0"
